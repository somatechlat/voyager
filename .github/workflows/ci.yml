name: CI

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff mypy pydantic httpx types-requests

      - name: Run Ruff linter
        run: ruff check apps/

      - name: Run Ruff formatter check
        run: ruff format --check apps/

      - name: Run mypy (strict)
        run: mypy --strict apps/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voyager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/voyager_test
          REDIS_URL: redis://localhost:6379/0

      - name: Run pytest with coverage
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/voyager_test
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t voyager:latest .

      - name: Validate image exists
        run: docker image inspect voyager:latest
