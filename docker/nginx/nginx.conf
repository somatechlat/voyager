# =============================================================================
# VOYAGER - Nginx Reverse Proxy Configuration
# =============================================================================
# Load balancing across 3 voyager-api replicas
# API proxy, WebSocket proxy, static/media serving, security headers
# Rate limiting, SSL configuration template
# =============================================================================

# Worker processes
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    server_tokens off;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    # API rate limiting: 100 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Auth endpoint stricter: 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # WebSocket connections: 50 concurrent per IP
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Burst queue for rate limiting
    limit_req_status 429;
    limit_conn_status 503;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # -------------------------------------------------------------------------
    # Upstream: Voyager API (load balance 3 replicas)
    # -------------------------------------------------------------------------
    upstream voyager_api_backend {
        least_conn;

        server voyager-api:8000 weight=5 max_fails=3 fail_timeout=30s;
        # Production replicas:
        # server voyager-api-1:8000 weight=5 max_fails=3 fail_timeout=30s;
        # server voyager-api-2:8000 weight=5 max_fails=3 fail_timeout=30s;
        # server voyager-api-3:8000 weight=5 max_fails=3 fail_timeout=30s;

        keepalive 32;
        keepalive_timeout 30s;
        keepalive_requests 100;
    }

    # -------------------------------------------------------------------------
    # Upstream: Keycloak
    # -------------------------------------------------------------------------
    upstream keycloak_backend {
        server voyager_keycloak:8080 weight=5 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # Security Headers Map
    # -------------------------------------------------------------------------
    map $upstream_http_content_security_policy $csp_header {
        default $upstream_http_content_security_policy;
        "" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    }

    # =================================================================
    # SERVER BLOCK: HTTP (redirect to HTTPS in production)
    # =================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Health check endpoint (bypass rate limiting)
        location /health {
            access_log off;
            proxy_pass http://voyager_api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # -------------------------------------------------------------------
        # API Endpoints: /api/v1/
        # -------------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://voyager_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;

            # Security Headers
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy $csp_header always;
        }

        # -------------------------------------------------------------------
        # Auth Endpoints (stricter rate limiting)
        # -------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://voyager_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
            proxy_buffering off;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # -------------------------------------------------------------------
        # WebSocket Proxy: /ws
        # -------------------------------------------------------------------
        location /ws {
            limit_conn ws_conn 50;

            proxy_pass http://voyager_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 7s;
            proxy_send_timeout 7s;
            proxy_read_timeout 86400s;
            proxy_buffering off;

            # Security headers for WS
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # -------------------------------------------------------------------
        # Static Files
        # -------------------------------------------------------------------
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------------
        # Media Files
        # -------------------------------------------------------------------
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ =404;
        }

        # -------------------------------------------------------------------
        # Keycloak Proxy
        # -------------------------------------------------------------------
        location /auth/ {
            proxy_pass http://keycloak_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # -------------------------------------------------------------------
        # Root: redirect to API docs or health
        # -------------------------------------------------------------------
        location / {
            return 302 /api/v1/;
        }
    }

    # =================================================================
    # SSL SERVER BLOCK (production - requires SSL certificates)
    # =================================================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name voyager.example.com;
    #
    #     ssl_certificate /etc/ssl/certs/voyager.crt;
    #     ssl_certificate_key /etc/ssl/private/voyager.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # Include same locations as HTTP server above
    #     # (copy location blocks here for production SSL)
    # }

    # =================================================================
    # Rate Limit Error Page
    # =================================================================
    error_page 429 /429.html;
    location = /429.html {
        internal;
        return 429 '{"detail": "Rate limit exceeded. Please try again later."}';
        add_header Content-Type application/json;
    }
}
